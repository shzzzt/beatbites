<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level select (light)</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF4FF}
a{color:#2667B0}a:hover{color:#D9468F}
.sparkles{position:absolute;left:0;top:0;width:6px;height:6px;box-shadow:40px 60px #E3D4FF,320px 90px #FFC9E3,120px 150px #C7E6FF,250px 40px #E3D4FF,60px 300px #FFC9E3,340px 260px #C7E6FF,200px 220px #E3D4FF,30px 520px #C7E6FF,360px 480px #FFC9E3,150px 400px #E3D4FF,280px 700px #C7E6FF,90px 780px #FFC9E3,330px 600px #E3D4FF}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF4FF; font-family: 'Pixelify Sans', sans-serif; color: #3B2A66; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 16px">
  <div class="sparkles" aria-hidden="true"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 14px">
    <button aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #EFE4FF; border: 4px solid #5B4494; box-shadow: 0 4px 0 #D9C8F5; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="2" height="2" fill="#3B2A66"/><rect x="2" y="3" width="2" height="2" fill="#3B2A66"/><rect x="2" y="5" width="2" height="2" fill="#3B2A66"/><rect x="4" y="7" width="2" height="2" fill="#3B2A66"/><rect x="4" y="4" width="5" height="2" fill="#3B2A66"/></svg>
    </button>
    <div style="font-family: 'Press Start 2P', monospace; font-size: 17px; color: #D9468F; text-shadow: 3px 3px 0 #FFE0EF; flex: 1">PICK A MEAL</div>
    <div style="font-size: 20px; font-weight: 700; color: #9A5B0C">★ 5/15</div>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 14px; margin-top: 8px">
    
        <button style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; background: #FFFFFF; color: #3B2A66; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.08), 0 6px 0 #D9C8F5; cursor: pointer; font-family: 'Pixelify Sans', sans-serif">
          <span style="width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; font-size: 20px; color: #3B2A66; background: #BFE2FF; border: 4px solid #5B4494">1</span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 22px; font-weight: 700">Breakfast</span>
            <span style="font-size: 16px; color: #6B58A0">90 BPM · learn to catch</span>
          </span>
          <span style="display: flex; gap: 3px" role="img" aria-label="3 of 3 stars">
            <svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg><svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg><svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg>
          </span>
        </button>
      
        <button style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; background: #FFFFFF; color: #3B2A66; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.08), 0 6px 0 #D9C8F5; cursor: pointer; font-family: 'Pixelify Sans', sans-serif">
          <span style="width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; font-size: 20px; color: #3B2A66; background: #DCCCFF; border: 4px solid #5B4494">2</span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 22px; font-weight: 700">Lunch</span>
            <span style="font-size: 16px; color: #6B58A0">100 BPM · 3 lanes</span>
          </span>
          <span style="display: flex; gap: 3px" role="img" aria-label="2 of 3 stars">
            <svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg><svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg><svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#E6DAFA"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg>
          </span>
        </button>
      
        <button style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; background: #FFFFFF; color: #3B2A66; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.08), 0 6px 0 #D9C8F5; cursor: pointer; font-family: 'Pixelify Sans', sans-serif">
          <span style="width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; font-family: 'Press Start 2P', monospace; font-size: 20px; color: #3B2A66; background: #FFCCE5; border: 4px solid #5B4494">3</span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 22px; font-weight: 700">Snack</span>
            <span style="font-size: 16px; color: #6B58A0">115 BPM · rotten food!</span>
          </span>
          <span style="display: flex; gap: 3px" role="img" aria-label="0 of 3 stars">
            <svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#E6DAFA"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg><svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#E6DAFA"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg><svg width="21" height="21" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#E6DAFA"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg>
          </span>
        </button>
      
        <button disabled="disabled" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; background: #F3ECFC; color: #6B58A0; border: 4px dashed #C9B6EE; font-family: 'Pixelify Sans', sans-serif; cursor: not-allowed">
          <span style="width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: #E6DAFA; border: 4px solid #C9B6EE">
            <svg width="28" height="32" viewBox="0 0 8 9" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="4" height="1" fill="#8E7BC4"/><rect x="1" y="1" width="1" height="3" fill="#8E7BC4"/><rect x="6" y="1" width="1" height="3" fill="#8E7BC4"/><rect x="0" y="4" width="8" height="5" fill="#8E7BC4"/><rect x="3" y="5" width="2" height="2" fill="#E6DAFA"/></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 22px; font-weight: 700">4 · Dinner</span>
            <span style="font-size: 16px">125 BPM · side switches</span>
          </span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 10px">LOCKED</span>
        </button>
      
        <button disabled="disabled" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px; text-align: left; background: #F3ECFC; color: #6B58A0; border: 4px dashed #C9B6EE; font-family: 'Pixelify Sans', sans-serif; cursor: not-allowed">
          <span style="width: 56px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: #E6DAFA; border: 4px solid #C9B6EE">
            <svg width="28" height="32" viewBox="0 0 8 9" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="0" width="4" height="1" fill="#8E7BC4"/><rect x="1" y="1" width="1" height="3" fill="#8E7BC4"/><rect x="6" y="1" width="1" height="3" fill="#8E7BC4"/><rect x="0" y="4" width="8" height="5" fill="#8E7BC4"/><rect x="3" y="5" width="2" height="2" fill="#E6DAFA"/></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0">
            <span style="font-size: 22px; font-weight: 700">5 · Dessert</span>
            <span style="font-size: 16px">140 BPM · everything</span>
          </span>
          <span style="font-family: 'Press Start 2P', monospace; font-size: 10px">LOCKED</span>
        </button>
      
  </div>

  <div style="position: relative; margin-top: auto; padding: 14px; border: 4px solid #5B4494; background: #EFE4FF; font-size: 17px; color: #3B2A66; text-align: center">Clear a meal to unlock the next one</div>
</div>
