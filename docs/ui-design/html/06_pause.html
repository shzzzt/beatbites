<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause menu (light)</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF4FF}
a{color:#2667B0}a:hover{color:#D9468F}
.sparkles{position:absolute;left:0;top:0;width:6px;height:6px;box-shadow:40px 60px #E3D4FF,320px 90px #FFC9E3,120px 150px #C7E6FF,250px 40px #E3D4FF,60px 300px #FFC9E3,340px 260px #C7E6FF,200px 220px #E3D4FF,30px 520px #C7E6FF,360px 480px #FFC9E3,150px 400px #E3D4FF,280px 700px #C7E6FF,90px 780px #FFC9E3,330px 600px #E3D4FF}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF4FF; font-family: 'Pixelify Sans', sans-serif; color: #3B2A66; box-sizing: border-box">
  <div class="sparkles" aria-hidden="true"></div>
  <div style="position: absolute; top: 200px; bottom: 120px; left: 136px; border-left: 4px dashed #E6DAFA" aria-hidden="true"></div>
  <div style="position: absolute; top: 200px; bottom: 120px; left: 252px; border-left: 4px dashed #E6DAFA" aria-hidden="true"></div>
  <div style="position: absolute; inset: 0; background: rgba(220,204,255,0.55)" aria-hidden="true"></div>

  <div role="dialog" aria-label="Paused" style="position: absolute; top: 170px; left: 32px; right: 32px; padding: 24px 20px; background: #FFFFFF; border: 4px solid #5B4494; box-shadow: inset 4px 4px 0 #F6F0FF, 0 8px 0 #C9B6EE; display: flex; flex-direction: column; gap: 16px">
    <div style="text-align: center; font-family: 'Press Start 2P', monospace; font-size: 24px; color: #D9468F; text-shadow: 3px 3px 0 #C7E6FF; margin-bottom: 8px">PAUSED</div>
    <div style="text-align: center; font-size: 17px; color: #6B58A0; margin-bottom: 4px">LV 3 · Snack · 23 / 40 bites</div>

    <button style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #3B2A66; background: #FFCCE5; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), inset 4px 4px 0 rgba(255,255,255,0.7), 0 6px 0 #D9C8F5; padding: 18px; cursor: pointer">RESUME</button>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #3B2A66; background: #BFE2FF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), inset 4px 4px 0 rgba(255,255,255,0.7), 0 6px 0 #D9C8F5; padding: 18px; cursor: pointer">RESTART</button>
    <button aria-pressed="true" style="display: flex; justify-content: space-between; align-items: center; font-family: 'Press Start 2P', monospace; font-size: 13px; color: #3B2A66; background: #DCCCFF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), 0 6px 0 #D9C8F5; padding: 16px 18px; cursor: pointer">
      <span>SOUND</span>
      <span style="padding: 6px 10px; background: #FFFFFF; color: #3E7A12; border: 3px solid #5B4494">ON</span>
    </button>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #3B2A66; background: #F6F0FF; border: 4px solid #5B4494; box-shadow: 0 6px 0 #D9C8F5; padding: 18px; cursor: pointer">QUIT TO MENU</button>
  </div>
</div>

</body>
</html>
