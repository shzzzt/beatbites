<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Result screen (light)</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF4FF}
a{color:#2667B0}a:hover{color:#D9468F}
.sparkles{position:absolute;left:0;top:0;width:6px;height:6px;box-shadow:40px 60px #E3D4FF,320px 90px #FFC9E3,120px 150px #C7E6FF,250px 40px #E3D4FF,60px 300px #FFC9E3,340px 260px #C7E6FF,200px 220px #E3D4FF,30px 520px #C7E6FF,360px 480px #FFC9E3,150px 400px #E3D4FF,280px 700px #C7E6FF,90px 780px #FFC9E3,330px 600px #E3D4FF}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF4FF; font-family: 'Pixelify Sans', sans-serif; color: #3B2A66; box-sizing: border-box; padding: 64px 20px 32px; display: flex; flex-direction: column; align-items: stretch; gap: 18px">
  <div class="sparkles" aria-hidden="true"></div>

  <div style="position: relative; text-align: center; font-size: 18px; color: #6B58A0">LV 3 · SNACK</div>
  <div style="position: relative; text-align: center; font-family: 'Press Start 2P', monospace; font-size: 22px; line-height: 1.5; color: #D9468F; text-shadow: 3px 3px 0 #C7E6FF">LEVEL<br>CLEARED!</div>

  <div style="position: relative; display: flex; justify-content: center; align-items: flex-end; gap: 10px" role="img" aria-label="2 of 3 stars">
    <svg width="64" height="64" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg>
    <svg width="84" height="84" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#F2B230"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg>
    <svg width="64" height="64" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#E6DAFA"><rect x="3" y="0" width="1" height="2"/><rect x="0" y="2" width="7" height="1"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="1" y="5" width="2" height="1"/><rect x="4" y="5" width="2" height="1"/><rect x="0" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></g></svg>
  </div>

  <div style="position: relative; padding: 16px; background: #FFFFFF; border: 4px solid #5B4494; box-shadow: 0 6px 0 #D9C8F5; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 18px; color: #6B58A0">SCORE</span><span style="font-family: 'Press Start 2P', monospace; font-size: 20px; color: #C23B80">04820</span></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 10px; background: #FFEFF7; border: 3px solid #FFC9E3; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #B02C6C">PERFECT</span><span style="font-size: 22px; font-weight: 700">31</span></div>
      <div style="padding: 10px; background: #EAF5FF; border: 3px solid #C7E6FF; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #2667B0">GOOD</span><span style="font-size: 22px; font-weight: 700">9</span></div>
      <div style="padding: 10px; background: #F6F0FF; border: 3px solid #E3D4FF; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #6B58A0">MISS</span><span style="font-size: 22px; font-weight: 700">3</span></div>
      <div style="padding: 10px; background: #FFF6DB; border: 3px solid #FFE3A0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #8A520B">MAX COMBO</span><span style="font-size: 22px; font-weight: 700">24</span></div>
    </div>
  </div>

  <div style="position: relative; padding: 12px 14px; background: #F1FBE6; border: 4px solid #8FD14F; display: flex; align-items: center; gap: 12px">
    <svg width="28" height="32" viewBox="0 0 8 9" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="0" width="3" height="1" fill="#5FA62A"/><rect x="7" y="1" width="1" height="3" fill="#5FA62A"/><rect x="3" y="1" width="1" height="1" fill="#5FA62A"/><rect x="0" y="4" width="8" height="5" fill="#5FA62A"/><rect x="3" y="5" width="2" height="2" fill="#F1FBE6"/></svg>
    <span style="font-size: 19px; font-weight: 700; color: #2F5E0C">Dinner unlocked!</span>
  </div>

  <div style="position: relative; margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #3B2A66; background: #DCCCFF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), 0 6px 0 #D9C8F5; padding: 18px 4px; cursor: pointer">RETRY</button>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #3B2A66; background: #FFCCE5; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), inset 4px 4px 0 rgba(255,255,255,0.7), 0 6px 0 #D9C8F5; padding: 18px 4px; cursor: pointer">NEXT ▸</button>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #3B2A66; background: #F6F0FF; border: 4px solid #5B4494; box-shadow: 0 6px 0 #D9C8F5; padding: 18px 4px; cursor: pointer">MENU</button>
  </div>
</div>

</body>
</html>
