<style>

        <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="1" width="2" height="8" fill="#3B2A66"></rect><rect x="6" y="1" width="2" height="8" fill="#3B2A66"></rect></svg>

    <span style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #2F5E0C">INCOMING!</span>

  <div style="position: absolute; top: 300px; bottom: 120px; left: 136px; border-left: 4px dashed #E6DAFA" aria-hidden="true"></div>
  <div style="position: absolute; top: 300px; bottom: 120px; left: 252px; border-left: 4px dashed #E6DAFA" aria-hidden="true"></div>

  </div>
  <div style="position: absolute; top: 400px; left: 54px" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="2" y="0" width="4" height="1" fill="#FF9ACD"></rect><rect x="1" y="1" width="6" height="1" fill="#FF9ACD"></rect><rect x="0" y="2" width="8" height="1" fill="#FF9ACD"></rect><rect x="0" y="3" width="3" height="1" fill="#FF9ACD"></rect><rect x="5" y="3" width="3" height="1" fill="#FF9ACD"></rect><rect x="0" y="4" width="3" height="1" fill="#F2C18E"></rect><rect x="5" y="4" width="3" height="1" fill="#F2C18E"></rect><rect x="0" y="5" width="8" height="1" fill="#F2C18E"></rect><rect x="1" y="6" width="6" height="1" fill="#F2C18E"></rect><rect x="2" y="7" width="4" height="1" fill="#D49A62"></rect><rect x="2" y="1" width="1" height="1" fill="#8CCBFF"></rect><rect x="5" y="2" width="1" height="1" fill="#FFF3A0"></rect></svg>

  <div style="position: absolute; top: 590px; left: 0; right: 0; text-align: center; font-family: 'Press Start 2P', monospace; font-size: 18px; color: #2667B0; text-shadow: 3px 3px 0 #FFC9E3">GOOD!</div>

  <div style="position: absolute; top: 700px; left: 16px; right: 16px; border-top: 4px dashed #FF9ACD" aria-hidden="true"></div>
  <div style="position: absolute; top: 640px; left: 31px" aria-hidden="true">
    <svg width="96" height="72" viewBox="0 0 12 9" shape-rendering="crispEdges"><rect x="1" y="0" width="1" height="2" fill="#FF9ACD"></rect><rect x="10" y="0" width="1" height="2" fill="#FF9ACD"></rect><rect x="0" y="2" width="12" height="1" fill="#E6F4FF"></rect><rect x="1" y="3" width="10" height="3" fill="#8CCBFF"></rect><rect x="2" y="6" width="8" height="1" fill="#8CCBFF"></rect><rect x="3" y="7" width="6" height="1" fill="#5FA6E8"></rect><rect x="4" y="8" width="4" height="1" fill="#5FA6E8"></rect><rect x="3" y="4" width="1" height="1" fill="#3B2A66"></rect><rect x="8" y="4" width="1" height="1" fill="#3B2A66"></rect><rect x="5" y="5" width="2" height="1" fill="#3B2A66"></rect><rect x="2" y="5" width="1" height="1" fill="#FF9ACD"></rect><rect x="9" y="5" width="1" height="1" fill="#FF9ACD"></rect></svg>

    <button aria-label="Move left" style="height: 72px; background: #EAF5FF; border: 4px solid #C7E6FF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="32" height="32" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><g fill="#2F7FD1"><rect x="1" y="3" width="1" height="2"></rect><rect x="2" y="2" width="1" height="4"></rect><rect x="3" y="1" width="1" height="6"></rect><rect x="4" y="3" width="3" height="2"></rect></g></svg>
