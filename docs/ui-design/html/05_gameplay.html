<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gameplay (light)</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF4FF}
a{color:#2667B0}a:hover{color:#D9468F}
.sparkles{position:absolute;left:0;top:0;width:6px;height:6px;box-shadow:40px 60px #E3D4FF,320px 90px #FFC9E3,120px 150px #C7E6FF,250px 40px #E3D4FF,60px 300px #FFC9E3,340px 260px #C7E6FF,200px 220px #E3D4FF,30px 520px #C7E6FF,360px 480px #FFC9E3,150px 400px #E3D4FF,280px 700px #C7E6FF,90px 780px #FFC9E3,330px 600px #E3D4FF}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF4FF; font-family: 'Pixelify Sans', sans-serif; color: #3B2A66; box-sizing: border-box">
  <div class="sparkles" aria-hidden="true"></div>

  <div style="position: absolute; top: 48px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Pause" style="width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; background: #EFE4FF; border: 4px solid #5B4494; box-shadow: 0 4px 0 #D9C8F5; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="1" width="2" height="8" fill="#3B2A66"/><rect x="6" y="1" width="2" height="8" fill="#3B2A66"/></svg>
    </button>
    <div style="display: flex; flex-direction: column; gap: 4px; flex: 1">
      <span style="font-size: 15px; color: #6B58A0">LV 3 · SNACK</span>
      <span style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: #C23B80">01240</span>
    </div>
    <div style="display: flex; gap: 4px" role="img" aria-label="2 of 3 lives left">
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><g fill="#FF8FB8"><rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></g></svg>
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><g fill="#FF8FB8"><rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></g></svg>
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><g fill="#E6DAFA"><rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/><rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></g></svg>
    </div>
  </div>

  <div style="position: absolute; top: 116px; left: 16px; right: 16px; padding: 10px 12px; background: #FFFFFF; border: 4px solid #5B4494; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; justify-content: space-between; font-size: 17px"><span>Goal: catch 40 bites</span><span style="color: #2667B0; font-weight: 700">23 / 40</span></div>
    <div style="height: 12px; background: #EFE4FF; border: 2px solid #5B4494; display: flex"><div style="width: 57%; background: #8CCBFF"></div></div>
  </div>

  <div style="position: absolute; top: 200px; bottom: 120px; left: 136px; border-left: 4px dashed #E6DAFA" aria-hidden="true"></div>
  <div style="position: absolute; top: 200px; bottom: 120px; left: 252px; border-left: 4px dashed #E6DAFA" aria-hidden="true"></div>

  <div style="position: absolute; top: 238px; left: 171px" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="2" y="0" width="4" height="1" fill="#FF9ACD"/><rect x="1" y="1" width="6" height="1" fill="#FF9ACD"/><rect x="0" y="2" width="8" height="1" fill="#FF9ACD"/><rect x="0" y="3" width="3" height="1" fill="#FF9ACD"/><rect x="5" y="3" width="3" height="1" fill="#FF9ACD"/><rect x="0" y="4" width="3" height="1" fill="#F2C18E"/><rect x="5" y="4" width="3" height="1" fill="#F2C18E"/><rect x="0" y="5" width="8" height="1" fill="#F2C18E"/><rect x="1" y="6" width="6" height="1" fill="#F2C18E"/><rect x="2" y="7" width="4" height="1" fill="#D49A62"/><rect x="2" y="1" width="1" height="1" fill="#8CCBFF"/><rect x="5" y="2" width="1" height="1" fill="#FFF3A0"/><rect x="6" y="3" width="1" height="1" fill="#FFFFFF"/></svg>
  </div>
  <div style="position: absolute; top: 312px; left: 54px" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="2" fill="#8A5A3C"/><rect x="4" y="1" width="2" height="1" fill="#7FD9A4"/><rect x="1" y="2" width="6" height="1" fill="#FF8FB8"/><rect x="0" y="3" width="8" height="3" fill="#FF8FB8"/><rect x="1" y="6" width="6" height="1" fill="#FF8FB8"/><rect x="2" y="7" width="4" height="1" fill="#E5679A"/><rect x="2" y="3" width="1" height="1" fill="#FFFFFF"/></svg>
  </div>
  <div style="position: absolute; top: 410px; left: 284px; padding: 4px; border: 3px dashed #8FD14F; background: #F1FBE6" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="0" y="2" width="2" height="3" fill="#8FD14F"/><rect x="1" y="3" width="1" height="1" fill="#3B2A66"/><rect x="2" y="3" width="5" height="1" fill="#9C8FC4"/><rect x="3" y="2" width="1" height="3" fill="#9C8FC4"/><rect x="5" y="2" width="1" height="3" fill="#9C8FC4"/><rect x="7" y="1" width="1" height="5" fill="#9C8FC4"/><rect x="2" y="0" width="1" height="1" fill="#8FD14F"/><rect x="4" y="6" width="1" height="1" fill="#8FD14F"/></svg>
  </div>
  <div style="position: absolute; top: 470px; left: 171px" aria-hidden="true">
    <svg width="48" height="48" viewBox="0 0 8 8" shape-rendering="crispEdges"><rect x="3" y="0" width="1" height="2" fill="#8A5A3C"/><rect x="4" y="1" width="2" height="1" fill="#7FD9A4"/><rect x="1" y="2" width="6" height="1" fill="#B79CFF"/><rect x="0" y="3" width="8" height="3" fill="#B79CFF"/><rect x="1" y="6" width="6" height="1" fill="#B79CFF"/><rect x="2" y="7" width="4" height="1" fill="#8F72E0"/><rect x="2" y="3" width="1" height="1" fill="#FFFFFF"/></svg>
  </div>

  <div style="position: absolute; top: 548px; left: 0; right: 0; text-align: center; font-family: 'Press Start 2P', monospace; font-size: 22px; color: #D9468F; text-shadow: 3px 3px 0 #C7E6FF">PERFECT!</div>
  <div style="position: absolute; top: 590px; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 700; color: #9A5B0C">x12 COMBO</div>

  <div style="position: absolute; top: 700px; left: 16px; right: 16px; border-top: 4px dashed #FF9ACD" aria-hidden="true"></div>
  <div style="position: absolute; top: 640px; left: 147px" aria-hidden="true">
    <svg width="96" height="72" viewBox="0 0 12 9" shape-rendering="crispEdges"><rect x="1" y="0" width="1" height="2" fill="#FF9ACD"/><rect x="10" y="0" width="1" height="2" fill="#FF9ACD"/><rect x="0" y="2" width="12" height="1" fill="#E6F4FF"/><rect x="1" y="3" width="10" height="3" fill="#8CCBFF"/><rect x="2" y="6" width="8" height="1" fill="#8CCBFF"/><rect x="3" y="7" width="6" height="1" fill="#5FA6E8"/><rect x="4" y="8" width="4" height="1" fill="#5FA6E8"/><rect x="3" y="4" width="1" height="1" fill="#3B2A66"/><rect x="8" y="4" width="1" height="1" fill="#3B2A66"/><rect x="5" y="5" width="2" height="1" fill="#3B2A66"/><rect x="2" y="5" width="1" height="1" fill="#FF9ACD"/><rect x="9" y="5" width="1" height="1" fill="#FF9ACD"/></svg>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button aria-label="Move left" style="height: 72px; background: #EAF5FF; border: 4px solid #C7E6FF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="32" height="32" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><g fill="#2F7FD1"><rect x="1" y="3" width="1" height="2"/><rect x="2" y="2" width="1" height="4"/><rect x="3" y="1" width="1" height="6"/><rect x="4" y="3" width="3" height="2"/></g></svg>
    </button>
    <button aria-label="Move right" style="height: 72px; background: #FFEFF7; border: 4px solid #FFC9E3; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="32" height="32" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><g fill="#D9468F"><rect x="6" y="3" width="1" height="2"/><rect x="5" y="2" width="1" height="4"/><rect x="4" y="1" width="1" height="6"/><rect x="1" y="3" width="3" height="2"/></g></svg>
    </button>
  </div>
</div>

</body>
</html>
