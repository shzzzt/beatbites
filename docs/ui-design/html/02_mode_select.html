<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Main menu and mode select (light)</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF4FF}
a{color:#2667B0}a:hover{color:#D9468F}
.sparkles{position:absolute;left:0;top:0;width:6px;height:6px;box-shadow:40px 60px #E3D4FF,320px 90px #FFC9E3,120px 150px #C7E6FF,250px 40px #E3D4FF,60px 300px #FFC9E3,340px 260px #C7E6FF,200px 220px #E3D4FF,30px 520px #C7E6FF,360px 480px #FFC9E3,150px 400px #E3D4FF,280px 700px #C7E6FF,90px 780px #FFC9E3,330px 600px #E3D4FF}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF4FF; font-family: 'Pixelify Sans', sans-serif; color: #3B2A66; box-sizing: border-box; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 24px">
  <div class="sparkles" aria-hidden="true"></div>

  <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: 'Press Start 2P', monospace; font-size: 18px; color: #D9468F; text-shadow: 3px 3px 0 #FFE0EF">BEAT BITES</div>
    <button aria-label="Sound on" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #EFE4FF; border: 4px solid #5B4494; box-shadow: 0 4px 0 #D9C8F5; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="4" width="2" height="4" fill="#3B2A66"/><rect x="3" y="3" width="1" height="6" fill="#3B2A66"/><rect x="4" y="2" width="1" height="8" fill="#3B2A66"/><rect x="5" y="1" width="1" height="10" fill="#3B2A66"/><rect x="7" y="4" width="1" height="4" fill="#2F7FD1"/><rect x="9" y="2" width="1" height="8" fill="#2F7FD1"/></svg>
    </button>
  </div>

  <div style="position: relative; font-family: 'Press Start 2P', monospace; font-size: 14px; color: #6B58A0; margin-top: 24px">CHOOSE A MODE</div>

  <button style="position: relative; text-align: left; display: flex; gap: 16px; align-items: center; padding: 20px; background: #BFE2FF; color: #3B2A66; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), inset 4px 4px 0 rgba(255,255,255,0.7), 0 8px 0 #D9C8F5; cursor: pointer; font-family: 'Pixelify Sans', sans-serif">
    <svg width="56" height="56" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="2" fill="#8A5A3C"/><rect x="4" y="1" width="2" height="1" fill="#7FD9A4"/><rect x="1" y="2" width="6" height="1" fill="#FF8FB8"/><rect x="0" y="3" width="8" height="3" fill="#FF8FB8"/><rect x="1" y="6" width="6" height="1" fill="#FF8FB8"/><rect x="2" y="7" width="4" height="1" fill="#E5679A"/><rect x="2" y="3" width="1" height="1" fill="#FFFFFF"/></svg>
    <span style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Press Start 2P', monospace; font-size: 17px">PLAY OFFLINE</span>
      <span style="font-size: 18px; font-weight: 600">Solo meals or vs CPU · no internet</span>
    </span>
  </button>

  <button style="position: relative; text-align: left; display: flex; gap: 16px; align-items: center; padding: 20px; background: #FFCCE5; color: #3B2A66; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), inset 4px 4px 0 rgba(255,255,255,0.7), 0 8px 0 #D9C8F5; cursor: pointer; font-family: 'Pixelify Sans', sans-serif">
    <svg width="56" height="56" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="2" width="2" height="3" fill="#8FD14F"/><rect x="1" y="3" width="1" height="1" fill="#3B2A66"/><rect x="2" y="3" width="5" height="1" fill="#9C8FC4"/><rect x="3" y="2" width="1" height="3" fill="#9C8FC4"/><rect x="5" y="2" width="1" height="3" fill="#9C8FC4"/><rect x="7" y="1" width="1" height="5" fill="#9C8FC4"/><rect x="2" y="0" width="1" height="1" fill="#8FD14F"/><rect x="4" y="6" width="1" height="1" fill="#8FD14F"/></svg>
    <span style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-family: 'Press Start 2P', monospace; font-size: 17px">PLAY ONLINE</span>
      <span style="font-size: 18px; font-weight: 600">Food-fight a friend · same Wi-Fi</span>
    </span>
  </button>

  <div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 8px">
    <button style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #3B2A66; background: #DCCCFF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), 0 6px 0 #D9C8F5; padding: 18px 8px; cursor: pointer">SETTINGS</button>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #3B2A66; background: #DCCCFF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), 0 6px 0 #D9C8F5; padding: 18px 8px; cursor: pointer">CREDITS</button>
  </div>

  <div style="position: relative; margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <svg width="96" height="72" viewBox="0 0 12 9" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="1" height="2" fill="#FF9ACD"/><rect x="10" y="0" width="1" height="2" fill="#FF9ACD"/><rect x="0" y="2" width="12" height="1" fill="#E6F4FF"/><rect x="1" y="3" width="10" height="3" fill="#8CCBFF"/><rect x="2" y="6" width="8" height="1" fill="#8CCBFF"/><rect x="3" y="7" width="6" height="1" fill="#5FA6E8"/><rect x="4" y="8" width="4" height="1" fill="#5FA6E8"/><rect x="3" y="4" width="1" height="1" fill="#3B2A66"/><rect x="8" y="4" width="1" height="1" fill="#3B2A66"/><rect x="5" y="5" width="2" height="1" fill="#3B2A66"/><rect x="2" y="5" width="1" height="1" fill="#FF9ACD"/><rect x="9" y="5" width="1" height="1" fill="#FF9ACD"/></svg>
    <div style="font-size: 18px; color: #6B58A0">★ 5 / 15 stars collected</div>
  </div>
</div>

</body>
</html>
