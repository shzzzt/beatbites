<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Online lobby (light)</title>
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF4FF}
a{color:#2667B0}a:hover{color:#D9468F}
.sparkles{position:absolute;left:0;top:0;width:6px;height:6px;box-shadow:40px 60px #E3D4FF,320px 90px #FFC9E3,120px 150px #C7E6FF,250px 40px #E3D4FF,60px 300px #FFC9E3,340px 260px #C7E6FF,200px 220px #E3D4FF,30px 520px #C7E6FF,360px 480px #FFC9E3,150px 400px #E3D4FF,280px 700px #C7E6FF,90px 780px #FFC9E3,330px 600px #E3D4FF}
input::placeholder{color:#7D6BB0}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF4FF; font-family: 'Pixelify Sans', sans-serif; color: #3B2A66; box-sizing: border-box; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 20px">
  <div class="sparkles" aria-hidden="true"></div>

  <div style="position: relative; display: flex; align-items: center; gap: 14px">
    <button aria-label="Back" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: #EFE4FF; border: 4px solid #5B4494; box-shadow: 0 4px 0 #D9C8F5; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 10 10" shape-rendering="crispEdges" aria-hidden="true"><rect x="4" y="1" width="2" height="2" fill="#3B2A66"/><rect x="2" y="3" width="2" height="2" fill="#3B2A66"/><rect x="2" y="5" width="2" height="2" fill="#3B2A66"/><rect x="4" y="7" width="2" height="2" fill="#3B2A66"/><rect x="4" y="4" width="5" height="2" fill="#3B2A66"/></svg>
    </button>
    <div style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: #D9468F; text-shadow: 3px 3px 0 #FFE0EF">FOOD FIGHT</div>
  </div>

  <div style="position: relative; padding: 18px; background: #FFFFFF; border: 4px solid #5B4494; box-shadow: 0 6px 0 #D9C8F5; display: flex; flex-direction: column; gap: 14px">
    <div style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #2667B0">HOST A MATCH</div>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #3B2A66; background: #BFE2FF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), inset 4px 4px 0 rgba(255,255,255,0.7), 0 6px 0 #D9C8F5; padding: 16px; cursor: pointer">HOST</button>
    <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; background: #F6F0FF; border: 4px solid #E3D4FF">
      <span style="font-size: 16px; color: #6B58A0">Your IP — tell your friend</span>
      <span style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: #3B2A66; letter-spacing: 1px">192.168.1.23</span>
      <span style="font-size: 17px">Waiting for player 2 …</span>
    </div>
  </div>

  <div style="position: relative; padding: 18px; background: #FFFFFF; border: 4px solid #5B4494; box-shadow: 0 6px 0 #D9C8F5; display: flex; flex-direction: column; gap: 14px">
    <div style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #C23B80">JOIN A MATCH</div>
    <label for="hostip-light" style="font-size: 17px">Host's IP address</label>
    <div style="display: flex; gap: 10px">
      <input id="hostip-light" type="text" inputmode="decimal" placeholder="e.g. 192.168.1.23" style="flex: 1; min-width: 0; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; color: #3B2A66; background: #F6F0FF; border: 4px solid #5B4494; box-shadow: inset 3px 3px 0 #E3D4FF; padding: 12px">
      <button style="font-family: 'Press Start 2P', monospace; font-size: 13px; color: #3B2A66; background: #FFCCE5; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), 0 6px 0 #D9C8F5; padding: 0 16px; cursor: pointer">JOIN</button>
    </div>
  </div>

  <div role="alert" style="position: relative; margin-top: auto; padding: 16px; background: #FFEAF4; border: 4px solid #E26AA6; box-shadow: 0 6px 0 #F5CDE1; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 12px; align-items: center">
      <svg width="28" height="28" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="1" fill="#E26AA6"/><rect x="2" y="1" width="3" height="2" fill="#E26AA6"/><rect x="1" y="3" width="5" height="2" fill="#E26AA6"/><rect x="0" y="5" width="7" height="2" fill="#E26AA6"/><rect x="3" y="2" width="1" height="2" fill="#FFFFFF"/><rect x="3" y="5" width="1" height="1" fill="#FFFFFF"/></svg>
      <span style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #B02C6C">CAN'T REACH HOST</span>
    </div>
    <span style="font-size: 18px">Check that both phones are on the same Wi-Fi, then try again.</span>
    <button style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #3B2A66; background: #DCCCFF; border: 4px solid #5B4494; box-shadow: inset -4px -4px 0 rgba(91,68,148,0.12), 0 6px 0 #D9C8F5; padding: 14px; cursor: pointer">BACK TO MODES</button>
  </div>
</div>

</body>
</html>
